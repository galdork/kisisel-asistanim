<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json"><title>Kişisel Asistanım</title>
<style>
:root{color-scheme:dark;--bg:#0c1422;--panel:#152236;--panel2:#1c2b42;--line:#2a3a52;--muted:#9aabc1;--txt:#f2f6fc;--blue:#6ea8ff;--green:#36c98a;--red:#ff737b;--gold:#f3c56a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#101c30,#0b1220 65%);color:var(--txt);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:12px 15px;background:var(--blue);color:#071326;font-weight:700}
button.secondary{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}button.danger{background:#572a38;color:#ffdce0}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#0e1929;color:var(--txt);outline:none}label{display:block;color:var(--muted);font-size:13px;margin:10px 0 6px}
.wrap{max-width:900px;margin:auto;padding:env(safe-area-inset-top) 16px calc(100px + env(safe-area-inset-bottom))}
header{padding:22px 2px 16px;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:0}.muted{color:var(--muted)}.small{font-size:12px;color:var(--muted)}
.card{background:linear-gradient(145deg,var(--panel),#111d2f);border:1px solid var(--line);border-radius:19px;padding:16px;margin:12px 0;box-shadow:0 10px 30px #0002}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:15px;border-radius:16px;background:var(--panel2);border:1px solid var(--line)}.metric strong{display:block;font-size:21px;margin-top:7px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#101b2bed;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{flex:1;max-width:150px;background:transparent;color:var(--muted);padding:9px 2px;font-size:11px}.nav button.active{color:var(--blue);background:#233653}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.pill{font-size:11px;padding:5px 8px;border-radius:20px;background:#25364d;color:#c6d8ef}.pill.green{background:#153d35;color:#80e6bc}.pill.red{background:#492630;color:#ffabb1}.pill.gold{background:#493d24;color:#ffdb8b}
.progress{height:9px;background:#29384e;border-radius:20px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:var(--green);border-radius:20px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none!important}
.installment{background:#101c2e;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}.installment.pastdue{border-color:#a94b57}.installment.done{border-color:#287b5c}.manual-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.center{min-height:100dvh;display:grid;place-items:center;padding:20px}.auth{width:min(420px,100%);text-align:center}.logo{font-size:42px;margin-bottom:10px}.auth .card{text-align:left}.notice{background:#26364c;border-radius:12px;padding:11px;color:#c6d8ef;font-size:12px;line-height:1.5}
.empty{text-align:center;color:var(--muted);padding:25px 10px}.top-actions{display:flex;gap:8px}.top-actions button{padding:9px 11px;font-size:12px}
.year-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.month{background:#101c2e;border:1px solid var(--line);border-radius:13px;padding:9px;min-width:0}.month h3{text-align:center;margin-bottom:8px;font-size:13px}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.day,.dow{display:grid;place-items:center;min-height:27px;font-size:10px;border-radius:6px}.dow{color:var(--muted);font-weight:700}.day.green{background:#174b3b;color:#9cf0ca}.day.red{background:#562b36;color:#ffc0c5}.day.blue{background:#203e66;color:#b8d8ff}.day.today{outline:2px solid #fff;outline-offset:1px;font-weight:900}.day.mine{box-shadow:inset 0 0 0 2px #f3c56a;font-weight:900}.legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.legend span{font-size:11px;padding:6px 8px;border-radius:8px}.legend .green{background:#174b3b;color:#9cf0ca}.legend .red{background:#562b36;color:#ffc0c5}.legend .blue{background:#203e66;color:#b8d8ff}
@media(max-width:600px){.year-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.day,.dow{min-height:25px;font-size:9px}}
@media(max-width:360px){.year-grid{grid-template-columns:1fr}.nav button{font-size:10px}}
</style></head>
<body>
<div id="auth" class="center"><div class="auth"><div class="logo">🔐</div><h1>Kişisel Asistanım</h1><p class="muted">Sana özel, güvenli kişisel alanın</p><div class="card" id="authbox"></div><p class="small">Kayıtların bu cihazda şifrelenerek saklanır.</p></div></div>
<div id="app" class="hidden"><div class="wrap">
<header><div><div class="small">KİŞİSEL ALANIN</div><h1 id="pageTitle">Genel Bakış</h1></div><div class="top-actions"><button class="secondary" onclick="lockApp()">Kilitle</button></div></header>
<section id="dashboard"></section><section id="birthdays" class="hidden"></section><section id="debts" class="hidden"></section><section id="shifts" class="hidden"></section><section id="settings" class="hidden"></section>
</div>
<nav class="nav"><button data-tab="dashboard" class="active" onclick="tab('dashboard')">⌂<br>Özet</button><button data-tab="birthdays" onclick="tab('birthdays')">🎂<br>Doğum Günleri</button><button data-tab="debts" onclick="tab('debts')">₺<br>Borçlar</button><button data-tab="shifts" onclick="tab('shifts')">🗓️<br>Vardiya</button><button data-tab="settings" onclick="tab('settings')">⚙<br>Ayarlar</button></nav>
</div>
<script>
const KEY='ka_vault_v1', META='ka_meta_v1';
let vault={birthdays:[],debts:[],shifts:[]},cryptoKey=null,currentTab='dashboard';
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)))}
function un64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function derive(pin,salt){const mat=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},mat,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptData(data,key){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(data)));return {iv:b64(iv),data:b64(ct),version:1}}
async function decryptData(blob,key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:un64(blob.iv)},key,un64(blob.data));return JSON.parse(new TextDecoder().decode(pt))}
function meta(){try{return JSON.parse(localStorage.getItem(META))}catch{return null}}
async function save(){const blob=await encryptData(vault,cryptoKey);localStorage.setItem(KEY,JSON.stringify(blob))}
function authUI(){const m=meta();$('authbox').innerHTML=m?`<h2>PIN kodunu gir</h2><label>4-12 haneli PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="12" placeholder="PIN kodun"><div class="actions"><button onclick="login()">Giriş yap</button></div><p id="autherr" class="small"></p>`:`<h2>İlk kurulum</h2><p class="muted">Yalnızca senin bildiğin 6 veya daha fazla haneli bir PIN belirle.</p><label>PIN kodu</label><input id="pin1" type="password" inputmode="numeric" maxlength="12" placeholder="En az 6 rakam"><label>PIN kodunu tekrar gir</label><input id="pin2" type="password" inputmode="numeric" maxlength="12" placeholder="PIN tekrar"><div class="actions"><button onclick="setup()">Güvenli alanı oluştur</button></div><p id="autherr" class="small"></p>`}
async function setup(){let a=$('pin1').value,b=$('pin2').value;if(!/^\d{6,12}$/.test(a)||a!==b){$('autherr').textContent='PIN 6-12 rakam olmalı ve iki giriş eşleşmeli.';return}const salt=crypto.getRandomValues(new Uint8Array(16));cryptoKey=await derive(a,salt);vault={birthdays:[],debts:[],shifts:[]};localStorage.setItem(META,JSON.stringify({salt:b64(salt),version:1}));await save();showApp()}
async function login(){let p=$('pin').value;try{const m=meta();cryptoKey=await derive(p,un64(m.salt));vault=await decryptData(JSON.parse(localStorage.getItem(KEY)),cryptoKey);vault.birthdays ||= [];vault.debts ||= [];vault.shifts ||= [];showApp()}catch{$('autherr').textContent='PIN yanlış veya kayıt verisi okunamadı.'}}
function lockApp(){cryptoKey=null;vault={birthdays:[],debts:[],shifts:[]};$('app').classList.add('hidden');$('auth').classList.remove('hidden');authUI()}
function showApp(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');renderAll()}
function tab(t){currentTab=t;['dashboard','birthdays','debts','shifts','settings'].forEach(x=>{$(x).classList.toggle('hidden',x!==t);document.querySelector(`[data-tab="${x}"]`).classList.toggle('active',x===t)});$('pageTitle').textContent={dashboard:'Genel Bakış',birthdays:'Doğum Günleri',debts:'Borç & Alacak',shifts:'Vardiya Takvimi',settings:'Ayarlar'}[t];renderAll()}
function daysUntil(date){const now=new Date(),d=new Date(date+'T12:00:00');d.setFullYear(now.getFullYear());if(d<new Date(now.getFullYear(),now.getMonth(),now.getDate()))d.setFullYear(now.getFullYear()+1);return Math.ceil((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000)}
function renderAll(){renderDash();renderBirthdays();renderDebts();renderShifts();renderSettings()}
function renderDash(){let receivable=vault.debts.filter(x=>x.direction==='out').reduce((s,x)=>s+debtRemaining(x),0),payable=vault.debts.filter(x=>x.direction==='in').reduce((s,x)=>s+debtRemaining(x),0);let upcoming=[...vault.birthdays].map(x=>({...x,days:daysUntil(x.date)})).sort((a,b)=>a.days-b.days).slice(0,3);let today=shiftFor(new Date());
$('dashboard').innerHTML=`<div class="grid"><div class="metric"><span class="small">Toplam alacağım</span><strong style="color:var(--green)">${money(receivable)}</strong></div><div class="metric"><span class="small">Toplam borcum</span><strong style="color:var(--red)">${money(payable)}</strong></div></div><div class="card"><div class="row"><h2>Bugünkü vardiyan</h2><span class="pill ${today.cls}">${today.post}</span></div><div style="font-size:20px;font-weight:800;margin-top:8px">${today.label}</div><div class="small">24/48 · 3 posta dönüşümü</div><div class="actions"><button class="secondary" onclick="tab('shifts')">Yıllık takvimi aç</button></div></div><div class="card"><div class="row"><h2>Yaklaşan doğum günleri</h2><button class="secondary" onclick="tab('birthdays')">Tümü</button></div>${upcoming.length?upcoming.map(x=>`<div class="item row"><div><b>${esc(x.name)}</b><div class="small">${esc(x.date.split('-').reverse().join('.'))}</div></div><span class="pill ${x.days<=7?'gold':''}">${x.days===0?'Bugün':x.days+' gün kaldı'}</span></div>`).join(''):'<div class="empty">Henüz doğum günü eklenmedi.</div>'}</div><div class="card"><div class="row"><h2>Son borç kayıtları</h2><button class="secondary" onclick="tab('debts')">Tümü</button></div>${vault.debts.slice(-3).reverse().map(debtRow).join('')||'<div class="empty">Henüz borç kaydı yok.</div>'}</div>`}
function renderBirthdays(){$('birthdays').innerHTML=`<div class="card"><h2>Yeni kişi ekle</h2><label>Adı</label><input id="bname" placeholder="Örn. Ayşe"><label>Doğum tarihi</label><input id="bdate" type="date"><div class="actions"><button onclick="addBirthday()">Kişiyi kaydet</button></div></div><div class="card"><h2>Kayıtlı kişiler (${vault.birthdays.length})</h2>${[...vault.birthdays].sort((a,b)=>daysUntil(a.date)-daysUntil(b.date)).map(x=>`<div class="item row"><div><b>${esc(x.name)}</b><div class="small">${x.date.split('-').reverse().join('.')} · ${daysUntil(x.date)} gün kaldı</div></div><button class="danger" onclick="removeBirthday('${x.id}')">Sil</button></div>`).join('')||'<div class="empty">Henüz kayıt yok.</div>'}</div>`}
async function addBirthday(){let name=$('bname').value.trim(),date=$('bdate').value;if(!name||!date){alert('Ad ve doğum tarihi gerekli.');return}vault.birthdays.push({id:crypto.randomUUID(),name,date});await save();renderAll()}
async function removeBirthday(id){if(confirm('Bu kaydı silmek istiyor musun?')){vault.birthdays=vault.birthdays.filter(x=>x.id!==id);await save();renderAll()}}

function renderDebts(){
 const today=localISO();
 $('debts').innerHTML=`<div class="card"><h2>Yeni borç / alacak kaydı</h2>
 <label>Kişi adı</label><input id="dname" placeholder="Kişinin adı">
 <div class="formgrid"><div><label>İşlem türü</label><select id="ddir"><option value="out">Ben para verdim (alacağım)</option><option value="in">Ben para aldım (borcum)</option></select></div><div><label>Kayıt tarihi</label><input id="ddate" type="date" value="${today}"></div></div>
 <label>Toplam tutar (₺)</label><input id="damt" type="number" min="0.01" step="0.01" placeholder="Örn. 30000" onchange="updateInstallmentForm()">
 <div class="formgrid"><div><label>Taksit yöntemi</label><select id="dmode" onchange="updateInstallmentForm()"><option value="equal">Otomatik eşit taksit</option><option value="manual">Taksitleri kendim belirleyeceğim</option></select></div><div><label>Taksit sayısı</label><input id="dcount" type="number" min="1" max="60" value="3" onchange="updateInstallmentForm()"></div></div>
 <div id="equalFields"><div class="formgrid"><div><label>İlk taksit tarihi</label><input id="dfirst" type="date" value="${today}"></div><div><label>Kaç ay arayla?</label><input id="dinterval" type="number" min="1" max="24" value="1"></div></div><p class="small">Tutar kuruşuna kadar eşit bölünür; bölünmeyen kuruş farkı son taksite eklenir.</p></div>
 <div id="manualFields" class="hidden"><p class="small">Her taksitin tutarını ve vadesini gir. Taksitlerin toplamı, toplam borç/alacak tutarına eşit olmalı.</p><div id="manualRows"></div></div>
 <label>İlk ödeme / peşinat (₺)</label><input id="dpaid" type="number" min="0" step="0.01" value="0">
 <label>Açıklama (isteğe bağlı)</label><input id="dnote" placeholder="Örn. Elden verildi">
 <div class="actions"><button onclick="addDebt()">Kaydı ve ödeme planını oluştur</button></div></div>
 <div class="card"><h2>Alacaklarım</h2>${vault.debts.filter(x=>x.direction==='out').map(debtRow).join('')||'<div class="empty">Alacak kaydı yok.</div>'}</div>
 <div class="card"><h2>Borçlarım</h2>${vault.debts.filter(x=>x.direction==='in').map(debtRow).join('')||'<div class="empty">Borç kaydı yok.</div>'}</div>`;
 updateInstallmentForm();
}
function localISO(d=new Date()){const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
function addMonthsISO(iso,months){const [y,m,day]=iso.split('-').map(Number);const first=new Date(y,m-1+months,1);const last=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();return localISO(new Date(first.getFullYear(),first.getMonth(),Math.min(day,last)))}
function updateInstallmentForm(){
 const mode=$('dmode')?.value||'equal',count=Math.max(1,Math.min(60,Number($('dcount')?.value)||1));
 $('equalFields')?.classList.toggle('hidden',mode!=='equal');$('manualFields')?.classList.toggle('hidden',mode!=='manual');
 if(mode==='manual'&&$('manualRows')){let total=Number($('damt')?.value)||0;let cents=Math.round(total*100),base=Math.floor(cents/count),rem=cents-base*count;let rows='';for(let i=0;i<count;i++){let defaultAmount=((base+(i===count-1?rem:0))/100).toFixed(2);rows+=`<div class="manual-row"><div><label>${i+1}. taksit tutarı (₺)</label><input class="manual-amount" type="number" min="0.01" step="0.01" value="${defaultAmount}"></div><div><label>${i+1}. taksit vadesi</label><input class="manual-date" type="date" value="${addMonthsISO($('dfirst')?.value||localISO(),i*(Number($('dinterval')?.value)||1))}"></div></div>`} $('manualRows').innerHTML=rows;}
}
function debtPaid(x){return Array.isArray(x.installments)?(Number(x.openingPaidAmount)||0)+x.installments.reduce((s,i)=>s+(Number(i.paidAmount)||0),0):(Number(x.paidAmount)||0)}
function debtRemaining(x){return Math.max(0,(Number(x.amount)||0)-debtPaid(x))}
function syncDebt(x){x.paidAmount=debtPaid(x);x.paid=x.paidAmount>=Number(x.amount)-0.005}
function dateLabel(d){return d?d.split('-').reverse().join('.'):'Tarih yok'}
function debtRow(x){
 const paid=debtPaid(x),rem=debtRemaining(x),pct=x.amount?Math.min(100,Math.round(paid/x.amount*100)):0;
 let installments=Array.isArray(x.installments)?x.installments:[];
 let schedule=installments.length?`<div style="margin-top:12px"><b class="small">TAKSİT PLANI (${installments.filter(i=>(Number(i.paidAmount)||0)>=Number(i.amount)-0.005).length}/${installments.length} tamamlandı)</b>${installments.map((i,n)=>{let ir=Math.max(0,Number(i.amount)-Number(i.paidAmount||0)),done=ir<=0.005,late=!done&&i.dueDate<localISO();return `<div class="installment ${done?'done':late?'pastdue':''}"><div class="row"><b>${n+1}. taksit · ${money(i.amount)}</b><span class="pill ${done?'green':late?'red':'gold'}">${done?'Ödendi':late?'Gecikti':'Bekliyor'}</span></div><div class="row small"><span>Vade: ${dateLabel(i.dueDate)}</span><span>Kalan: ${money(ir)}</span></div>${(i.payments||[]).length?`<div class="small" style="margin-top:6px">Ödemeler: ${(i.payments||[]).map(p=>`${money(p.amount)} (${dateLabel(p.date)})`).join(' · ')}</div>`:''}${!done?`<div class="actions"><button class="secondary" onclick="payment('${x.id}','${i.id}')">Bu taksite ödeme ekle</button></div>`:''}</div>`}).join('')}</div>`:'<p class="small">Eski kayıt · Henüz taksit planı yok.</p>';
 let legacyHistory=(x.paymentHistory||[]).length?`<div class="small">Önceki ödemeler: ${(x.paymentHistory||[]).map(p=>`${money(p.amount)} (${dateLabel(p.date)})`).join(' · ')}</div>`:'';let legacyActions=installments.length?'':`<button class="secondary" onclick="createLegacyPlan('${x.id}')">Taksit planı oluştur</button><button class="secondary" onclick="payment('${x.id}')">Ödeme ekle</button>`;
 return `<div class="item"><div class="row"><b>${esc(x.name)}</b><span class="pill ${rem===0?'green':paid>0?'gold':'red'}">${rem===0?'Ödendi':paid>0?'Kısmen ödendi':'Ödenmedi'}</span></div><div class="small">${dateLabel(x.date)} · ${x.direction==='out'?'Alacağım':'Borcum'} ${x.note?'· '+esc(x.note):''}</div><div class="row" style="margin-top:8px"><span class="small">Toplam: ${money(x.amount)}</span><b>${money(rem)} kaldı</b></div><div class="progress"><span style="width:${pct}%"></span></div><div class="row small"><span>${pct}% ödendi · ${money(paid)}</span><span>${money(x.amount)} toplam</span></div>${legacyHistory}${schedule}<div class="actions">${legacyActions}<button class="danger" onclick="removeDebt('${x.id}')">Sil</button></div></div>`;
}
async function addDebt(){
 let name=$('dname').value.trim(),amount=Number($('damt').value),paid=Number($('dpaid').value||0),date=$('ddate').value,count=Math.max(1,Math.min(60,Number($('dcount').value)||1));
 if(!name||!date||!Number.isFinite(amount)||amount<=0||paid<0||paid>amount){alert('Bilgileri kontrol et. Peşinat toplam tutardan fazla olamaz.');return}
 let installments=[],mode=$('dmode').value;
 if(mode==='equal'){
  let first=$('dfirst').value,interval=Number($('dinterval').value);
  if(!first||!Number.isInteger(interval)||interval<1||interval>24){alert('İlk taksit tarihini ve 1-24 ay arası taksit aralığını kontrol et.');return}
  let cents=Math.round(amount*100),base=Math.floor(cents/count),rem=cents-base*count;
  for(let i=0;i<count;i++)installments.push({id:crypto.randomUUID(),amount:(base+(i===count-1?rem:0))/100,dueDate:addMonthsISO(first,i*interval),paidAmount:0,payments:[]});
 }else{
  let amounts=[...document.querySelectorAll('.manual-amount')].map(e=>Number(e.value)),dates=[...document.querySelectorAll('.manual-date')].map(e=>e.value);
  if(amounts.length!==count||amounts.some((v,i)=>!Number.isFinite(v)||v<=0||!dates[i])){alert('Her taksit için geçerli tutar ve vade gir.');return}
  let sum=amounts.reduce((a,b)=>a+Math.round(b*100),0),total=Math.round(amount*100);
  if(sum!==total){alert('Manuel taksitlerin toplamı, toplam borç/alacak tutarıyla aynı olmalı. Şu anki toplam: '+money(sum/100));return}
  installments=amounts.map((v,i)=>({id:crypto.randomUUID(),amount:Math.round(v*100)/100,dueDate:dates[i],paidAmount:0,payments:[]}));
 }
 let left=Math.round(paid*100)/100,paidDate=date;
 for(let inst of installments){if(left<=0)break;let take=Math.min(inst.amount,left);inst.paidAmount=take;inst.payments.push({amount:take,date:paidDate});left=Math.round((left-take)*100)/100}
 let item={id:crypto.randomUUID(),name,direction:$('ddir').value,date,amount:Math.round(amount*100)/100,paidAmount:paid,note:$('dnote').value.trim(),paid:paid>=amount,installmentMode:mode,installments};
 syncDebt(item);vault.debts.push(item);await save();renderAll();
}
async function payment(id,installmentId){
 let x=vault.debts.find(v=>v.id===id);if(!x)return;
 if(!Array.isArray(x.installments)||!x.installments.length){
  let remaining=debtRemaining(x);if(remaining<=0)return alert('Bu borç zaten kapanmış.');
  let v=prompt('Eklenen ödeme tutarı (kalan: '+money(remaining)+')');if(v===null)return;let n=Number(v);if(!Number.isFinite(n)||n<=0||n>remaining)return alert('Geçerli bir tutar gir.');
  let dt=prompt('Ödeme tarihi (YYYY-AA-GG):',localISO());if(dt===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(dt))return alert('Tarihi YYYY-AA-GG biçiminde gir.');
  x.paymentHistory||=[];x.paymentHistory.push({amount:n,date:dt});x.paidAmount=(Number(x.paidAmount)||0)+n;x.paid=x.paidAmount>=x.amount;await save();renderAll();return;
 }
 let inst=installmentId?x.installments.find(i=>i.id===installmentId):x.installments.find(i=>Number(i.paidAmount||0)<Number(i.amount)-0.005);
 if(!inst)return alert('Ödenmemiş taksit kalmamış.');
 let remaining=Math.max(0,inst.amount-(Number(inst.paidAmount)||0));if(remaining<=0)return;
 let v=prompt(`${dateLabel(inst.dueDate)} vadeli taksit için ödeme (kalan: ${money(remaining)})`);if(v===null)return;let n=Number(v);if(!Number.isFinite(n)||n<=0||n>remaining+0.001)return alert('Geçerli bir tutar gir.');
 let dt=prompt('Ödeme tarihi (YYYY-AA-GG):',localISO());if(dt===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(dt))return alert('Tarihi YYYY-AA-GG biçiminde gir.');
 inst.payments||=[];inst.payments.push({amount:Math.round(n*100)/100,date:dt});inst.paidAmount=Math.round(((Number(inst.paidAmount)||0)+n)*100)/100;syncDebt(x);await save();renderAll();
}
async function createLegacyPlan(id){
 let x=vault.debts.find(v=>v.id===id);if(!x)return;let remaining=debtRemaining(x);if(remaining<=0)return alert('Bu kayıt zaten tamamen ödenmiş.');
 let count=Number(prompt('Kaç taksit olsun? (1-60)', '3'));if(!Number.isInteger(count)||count<1||count>60)return alert('1-60 arasında taksit sayısı gir.');
 let mode=prompt('Eşit taksit için E, manuel taksit için M yaz:', 'E');if(mode===null)return;
 let first=prompt('İlk taksit tarihi (YYYY-AA-GG):',localISO());if(first===null||!/^\d{4}-\d{2}-\d{2}$/.test(first))return alert('Tarih biçimini kontrol et.');
 let dates=[],amounts=[];
 if(mode.toLowerCase()==='m'){
  for(let i=0;i<count;i++){let d=prompt(`${i+1}. taksit vadesi (YYYY-AA-GG):`,addMonthsISO(first,i));if(d===null||!/^\d{4}-\d{2}-\d{2}$/.test(d))return alert('Tarih biçimini kontrol et.');let a=Number(prompt(`${i+1}. taksit tutarı (₺):`,(remaining/count).toFixed(2)));if(!Number.isFinite(a)||a<=0)return alert('Taksit tutarını kontrol et.');dates.push(d);amounts.push(Math.round(a*100))}
  if(amounts.reduce((a,b)=>a+b,0)!==Math.round(remaining*100))return alert('Manuel taksitlerin toplamı kalan tutara eşit olmalı. Plan oluşturulmadı.');
 }else{let interval=Number(prompt('Taksitler kaç ay arayla olsun?','1'));if(!Number.isInteger(interval)||interval<1||interval>24)return alert('1-24 arasında ay aralığı gir.');let cents=Math.round(remaining*100),base=Math.floor(cents/count),rem=cents-base*count;for(let i=0;i<count;i++){amounts.push(base+(i===count-1?rem:0));dates.push(addMonthsISO(first,i*interval))}}
 x.openingPaidAmount=Number(x.paidAmount)||0;x.installmentMode=(mode.toLowerCase()==='m'?'manual':'equal');x.installments=amounts.map((c,i)=>({id:crypto.randomUUID(),amount:c/100,dueDate:dates[i],paidAmount:0,payments:[]}));syncDebt(x);await save();renderAll();
}
async function removeDebt(id){if(confirm('Bu borç kaydını silmek istiyor musun?')){vault.debts=vault.debts.filter(x=>x.id!==id);await save();renderAll()}}
// Vardiya hesabı: 01.01.2025 yeşil/3. posta; 02.01 kırmızı/1. posta; 03.01 mavi/2. posta. Döngü her gün devam eder.
const SHIFT_ANCHOR=new Date(2025,0,1);const MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
function shiftFor(date){const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());const diff=Math.round((d-SHIFT_ANCHOR)/86400000);const n=((diff%3)+3)%3;return n===0?{post:'3. Posta',label:'Yeşil gün',cls:'green'}:n===1?{post:'1. Posta',label:'Kırmızı gün',cls:'red'}:{post:'2. Posta',label:'Mavi gün',cls:'blue'}}
async function setSelectedPost(value){vault.selectedPost=value?Number(value):null;await save();renderShifts()}
function renderShifts(){let y=Number($('shiftYear')?.value)||new Date().getFullYear();let selected=Number(vault.selectedPost)||0;let html=`<div class="card"><div class="row"><div><h2>Yıllık vardiya takvimi</h2><div class="small">24/48 düzeni · 3 günlük renk döngüsü</div></div><div style="width:105px"><label for="shiftYear">Yıl</label><input id="shiftYear" type="number" min="2025" max="2100" value="${y}" onchange="renderShifts()"></div></div><label for="selectedPost">Benim postam</label><select id="selectedPost" onchange="setSelectedPost(this.value)"><option value="">Posta seç</option><option value="1" ${selected===1?'selected':''}>1. Posta · Kırmızı</option><option value="2" ${selected===2?'selected':''}>2. Posta · Mavi</option><option value="3" ${selected===3?'selected':''}>3. Posta · Yeşil</option></select><p class="small">Seçimin şifreli kayıtlarına kaydedilir ve sonraki açılışlarda korunur. Takvimde seçtiğin postanın günleri altın çerçeveyle belirginleşir; posta renkleri değişmez.</p><div class="legend"><span class="green">Yeşil · 3. Posta</span><span class="red">Kırmızı · 1. Posta</span><span class="blue">Mavi · 2. Posta</span></div><p class="small">Beyaz çerçeveli gün bugünü gösterir. Takvim 1 Ocak 2025 başlangıçlı sabit döngüye göre hesaplanır.</p></div><div class="year-grid">`;
for(let m=0;m<12;m++){let first=new Date(y,m,1),count=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7;html+=`<div class="month"><h3>${MONTHS[m]}</h3><div class="days">${['P','S','Ç','P','C','C','P'].map(x=>`<div class="dow">${x}</div>`).join('')}`;for(let i=0;i<offset;i++)html+='<div></div>';for(let day=1;day<=count;day++){let d=new Date(y,m,day),s=shiftFor(d),today=d.toDateString()===new Date().toDateString(),mine=selected>0&&Number(s.post[0])===selected;html+=`<div class="day ${s.cls} ${mine?'mine':''} ${today?'today':''}" title="${day} ${MONTHS[m]} ${y} · ${s.post}${mine?' · Senin postan':''}">${day}</div>`}html+='</div></div>'}
html+='</div>'; $('shifts').innerHTML=html}
function renderSettings(){$('settings').innerHTML=`<div class="card"><h2>Güvenlik</h2><p class="muted">Uygulama PIN ile açılır. Kayıtların AES-GCM ile şifrelenerek bu tarayıcıda saklanır.</p><div class="actions"><button class="secondary" onclick="changePin()">PIN kodunu değiştir</button><button class="secondary" onclick="lockApp()">Şimdi kilitle</button></div></div><div class="card"><h2>Yedekleme</h2><p class="muted">Yedek dosyan şifreli veriyi içerir. Dosyayı güvenli bir yerde sakla. Geri yüklemek için aynı PIN gerekir.</p><div class="actions"><button onclick="backup()">Şifreli yedek indir</button><button class="secondary" onclick="$('restoreFile').click()">Yedekten geri yükle</button></div><input id="restoreFile" type="file" accept=".json,application/json" class="hidden" onchange="restoreBackup(event)"></div><div class="card"><h2>Veri ve gizlilik</h2><p class="small">Veriler bu cihazın tarayıcı depolamasında tutulur. Safari geçmişini ve web sitesi verilerini temizlemek kayıtları silebilir. Düzenli yedek almanı öneririz. Uygulama bağlantısını başkalarıyla paylaşma.</p></div><div class="card"><h2>Kurulum</h2><p class="small">Ana ekrana ekledikten sonra uygulama simgesinden açabilirsin. Çevrimdışı kullanım için uygulamayı en az bir kez internet bağlıyken aç.</p></div>`}
async function changePin(){let old=prompt('Mevcut PIN kodun:');if(old===null)return;try{const m=meta(),k=await derive(old,un64(m.salt));await decryptData(JSON.parse(localStorage.getItem(KEY)),k)}catch{return alert('Mevcut PIN yanlış.')}let p=prompt('Yeni PIN (6-12 rakam):');if(!/^\d{6,12}$/.test(p||''))return alert('PIN 6-12 rakam olmalı.');let salt=crypto.getRandomValues(new Uint8Array(16));cryptoKey=await derive(p,salt);localStorage.setItem(META,JSON.stringify({salt:b64(salt),version:1}));await save();alert('PIN değiştirildi.')}
async function backup(){let blob={format:'kisisel-asistanim-encrypted-backup',meta:meta(),vault:JSON.parse(localStorage.getItem(KEY)),createdAt:new Date().toISOString()};let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(blob)],{type:'application/json'}));a.href=url;a.download='kisisel-asistanim-yedek-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url)}
async function restoreBackup(e){let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(obj.format!=='kisisel-asistanim-encrypted-backup')throw 0;let p=prompt('Yedeği açmak için yedek alındığındaki PIN kodunu gir:');if(p===null)return;let k=await derive(p,un64(obj.meta.salt)),data=await decryptData(obj.vault,k);if(!confirm('Mevcut kayıtların yerine yedekteki '+data.birthdays.length+' doğum günü, '+data.debts.length+' borç ve '+(data.shifts||[]).length+' vardiya kaydı yüklenecek. Devam?'))return;cryptoKey=k;vault=data;vault.shifts ||= [];localStorage.setItem(META,JSON.stringify(obj.meta));await save();renderAll();alert('Yedek başarıyla geri yüklendi.')}catch{alert('Yedek açılamadı. Dosya bozuk olabilir veya PIN yanlış olabilir.')}finally{e.target.value=''}}
authUI();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
